export_root: "res://addons/gdpackage/export_ignore/exports/"
build_require: @require
# The fixture plugin export_fixture_test exports five ways; test-only, so it never ships.
test_require:
  - "@require"
  - "brohd11/godot-plugin-exporter-test-plugin@v0.2.2"
exports:
  -
    exclude:
      directories:
        - "res://addons/gdpackage/export_ignore"
      file_extensions: []
      files: []
    remote_dir: "res://addons/gdpackage/src/remote/"
    export_name: "gdpackage{{version=gdpackage}}"
    export_folder: "addons/gdpackage"
    other_transfers: []
    source: "res://addons/gdpackage/"
    parser_overide_settings:
      parse_cs: {}
      parse_gd: {}
      parse_tscn: {}
      parse_tres: {}
options:
  include_import: true
  include_uid: true
  overwrite: true
  parser_settings:
    use_relative_paths: false
    replace_editor_interface: false
    parse_cs: {}
    parse_gd:
      class_rename_ignore: []
      backport_string_renames: {}
    parse_tscn: {}
    parse_tres: {}
plugin_folder: "GDPackage/GDPackage{{version=gdpackage}}"
post_script: ""
pre_script: ""
