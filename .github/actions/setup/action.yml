# Shared setup for GDPackage's reusable workflows: reads the package cfg checked out at pkg/,
# installs Godot, restores the caches, and assembles a project in $WS around a released
# gdpackage. Callers check out to pkg/ and set WS and GH_TOKEN on the job.
name: gdpackage-setup
description: Godot + a released gdpackage in $WS, for a package checked out at pkg/.

inputs:
  godot-version:
    description: A godot-builds release name (4.6.3-stable, 4.8-beta1); a bare 4.7 means 4.7-stable.
    required: true
  toolchain-version:
    description: gdpackage release to use; empty means its latest release.
    default: ""
  install-path:
    description: Where the package installs; empty reads path= from its cfg, then export_folder from its export config.
    default: ""
  package-dir:
    description: Where the package sits in the repo when that isn't the root (whole-project repos); empty finds its cfg.
    default: ""
  release:
    description: "true: a release build - the tag must match version=, and a package at the repo root moves into $WS at its install path (see moved)."
    default: "false"
  publish:
    description: With release, publishing requires a tag push.
    default: "false"

outputs:
  version:
    value: ${{ steps.pkg.outputs.version }}
  path:
    description: The install path, e.g. addons/_lib/x.
    value: ${{ steps.pkg.outputs.path }}
  godot:
    description: The normalised godot-builds name.
    value: ${{ steps.pkg.outputs.godot }}
  self:
    description: "true when the package is gdpackage itself: with release, pkg/ stays put and release_cli takes it as --tree."
    value: ${{ steps.pkg.outputs.self }}
  dir:
    description: The package's checkout, absolute - pkg/ or the folder inside it holding the package cfg.
    value: ${{ steps.pkg.outputs.dir }}
  moved:
    description: "true when pkg/ joined $WS at the install path; otherwise the CLIs take dir as --tree."
    value: ${{ steps.pkg.outputs.moved }}

runs:
  using: composite
  steps:
    - name: Read package cfg
      id: pkg
      shell: bash
      env:
        INSTALL_PATH: ${{ inputs.install-path }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
        RELEASE: ${{ inputs.release }}
        PUBLISH: ${{ inputs.publish }}
        GODOT_VERSION: ${{ inputs.godot-version }}
        # Oldest Godot gdpackage itself runs on.
        GODOT_FLOOR: "4.6"
      run: |
        set -euo pipefail
        godot="$GODOT_VERSION"
        case "$godot" in *-*) ;; *) godot="$godot-stable" ;; esac
        IFS=. read -r major minor _ <<< "${godot%%-*}"
        IFS=. read -r fmajor fminor <<< "$GODOT_FLOOR"
        if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ ]]; then
          echo "::error::godot-version \"$GODOT_VERSION\" isn't a Godot version"; exit 1
        fi
        if (( major * 1000 + minor < fmajor * 1000 + fminor )); then
          echo "::error::godot-version $godot is too old: gdpackage runs on Godot $GODOT_FLOOR+"; exit 1
        fi
        echo "godot=$godot" >> "$GITHUB_OUTPUT"

        # A package key's value, unquoted, as PackageCfg reads it: [package] over legacy [addon]
        # over [plugin], other sections ignored. A missing key is "".
        cfg_value() {
          awk -v key="$2" '
            /^[[:space:]]*\[/ { sec = $0; gsub(/^[[:space:]]*\[|\][[:space:]]*$/, "", sec); next }
            sec != "package" && sec != "addon" && sec != "plugin" { next }
            (sec in got) || index($0, "=") == 0 { next }
            {
              k = $0; sub(/=.*/, "", k); gsub(/[[:space:]]/, "", k)
              if (k != key) next
              v = $0; sub(/^[^=]*=[[:space:]]*/, "", v)
              if (substr(v, 1, 1) == "\"") { v = substr(v, 2); i = index(v, "\""); if (i) v = substr(v, 1, i - 1) }
              else sub(/[[:space:]]*([;#].*)?$/, "", v)
              got[sec] = v
            }
            END {
              if ("package" in got) print got["package"]
              else if ("addon" in got) print got["addon"]
              else if ("plugin" in got) print got["plugin"]
            }' "$1"
        }
        # The package cfg in a dir, in gdpackage_spec's lookup order.
        cfg_in() {
          local name
          for name in plugin.cfg package.cfg addon.cfg version.cfg; do
            if [ -f "$1/$name" ]; then echo "$1/$name"; return 0; fi
          done
          return 0
        }
        # owner/repo of a url=, lowercased, to compare with GITHUB_REPOSITORY.
        repo_of() { local u="${1%/}"; u="${u%.git}"; u="${u//://}"; awk -F/ 'NF >= 2 { print tolower($(NF-1) "/" $NF) }' <<< "$u"; }

        dir="${PACKAGE_DIR#./}"
        dir="${dir%/}"
        if [ -n "$dir" ]; then
          if [ -z "$(cfg_in "pkg/$dir")" ]; then
            echo "::error::no plugin.cfg / package.cfg / addon.cfg / version.cfg in package-dir $dir"; exit 1
          fi
        elif [ -z "$(cfg_in pkg)" ]; then
          # A whole-project repo: the outermost tracked cfg outside export_ignore fixtures, or among
          # several the one whose url= names this repo - the same pick as PackageLayout.locate.
          mapfile -t found < <(git -C pkg ls-files | grep -E '/(plugin|package|addon|version)\.cfg$' \
            | grep -vE '(^|/)_?export_ignore/' | sed -E 's#/[^/]+$##' | sort -u)
          top=()
          for d in "${found[@]}"; do
            nested=false
            for o in "${found[@]}"; do
              if [[ "$d" == "$o"/* ]]; then nested=true; fi
            done
            if [ "$nested" = "false" ]; then top+=("$d"); fi
          done
          picked=("${top[@]}")
          if [ "${#top[@]}" -gt 1 ]; then
            picked=()
            for d in "${top[@]}"; do
              if [ "$(repo_of "$(cfg_value "$(cfg_in "pkg/$d")" url)")" = "${GITHUB_REPOSITORY,,}" ]; then picked+=("$d"); fi
            done
          fi
          if [ "${#picked[@]}" -ne 1 ]; then
            echo "::error::no plugin.cfg / package.cfg / addon.cfg / version.cfg at the repo root, and ${#top[@]} package cfgs elsewhere${top[*]:+ (${top[*]})}; pass package-dir"; exit 1
          fi
          dir="${picked[0]}"
        fi
        pkg_dir="pkg${dir:+/$dir}"
        cfg=$(cfg_in "$pkg_dir")
        value() { cfg_value "$cfg" "$1"; }

        version=$(value version)
        [ -n "$version" ] || { echo "::error::no version= in $cfg"; exit 1; }
        if [ "$RELEASE" = "true" ]; then
          # export_release builds whatever tag matches version=, so a mismatched push would ship another tag.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match version=\"$version\" in $cfg"; exit 1
            fi
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::publishing needs a tag push; run with publish: false to only build"; exit 1
          fi
        fi

        path="$INSTALL_PATH"
        [ -n "$path" ] || path=$(value path)
        if [ -z "$path" ]; then
          # Packages have one of the two dirs, so an unmatched glob is expected.
          path=$(grep -h -m1 -E '^[[:space:]]*export_folder:' "$pkg_dir"/_export_ignore/*.yml "$pkg_dir"/export_ignore/*.yml 2>/dev/null \
            | head -1 | sed -E 's/^[[:space:]]*export_folder:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/') || true
        fi
        case "$path" in
          ""|*"{{"*) echo "::error::can't tell where the package installs: set path= in $cfg or pass install-path"; exit 1 ;;
        esac
        path="${path%/}"
        # gdpackage installs where the toolchain lives, so its checkout can't join $WS.
        self=false
        [ "$path" = "addons/gdpackage" ] && self=true
        # Only a package that is the whole repo can join $WS with its .git; anything else stays put.
        moved=false
        if [ "$RELEASE" = "true" ] && [ "$self" = "false" ] && [ -z "$dir" ]; then moved=true; fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "self=$self" >> "$GITHUB_OUTPUT"
        echo "rel=$pkg_dir" >> "$GITHUB_OUTPUT"
        echo "dir=$GITHUB_WORKSPACE/$pkg_dir" >> "$GITHUB_OUTPUT"
        echo "moved=$moved" >> "$GITHUB_OUTPUT"

    - name: Cache Godot
      id: godot-cache
      uses: actions/cache@v6
      with:
        path: ~/godot
        key: godot-${{ steps.pkg.outputs.godot }}-linux

    - name: Install Godot
      if: steps.godot-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ steps.pkg.outputs.godot }}
      run: |
        set -euo pipefail
        install_tmp=$(mktemp -d "$RUNNER_TEMP/godot-install.XXXXXX")
        trap 'rm -rf "$install_tmp"' EXIT
        name="Godot_v${GODOT_VERSION}_linux.x86_64"
        for attempt in 1 2 3; do
          if timeout --kill-after=10s 120s gh release download "$GODOT_VERSION" \
            --repo godotengine/godot-builds --pattern "$name.zip" --dir "$install_tmp" --clobber; then
            break
          else
            download_status=$?
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::Failed to download $name.zip from godotengine/godot-builds at $GODOT_VERSION after 3 attempts (exit $download_status)"
            exit "$download_status"
          fi
          echo "::warning::Godot download attempt $attempt/3 failed (exit $download_status); retrying"
          sleep "$((attempt * 2))"
        done
        unzip -tq "$install_tmp/$name.zip"
        unzip -q "$install_tmp/$name.zip" "$name" -d "$install_tmp"
        if [ ! -x "$install_tmp/$name" ]; then
          echo "::error::Godot archive has no executable $name"
          exit 1
        fi
        installed_version=$(timeout --kill-after=5s 15s "$install_tmp/$name" --version)
        echo "$installed_version"
        expected_version="${GODOT_VERSION/-/.}"
        case "$installed_version" in
          "$expected_version"|"$expected_version".*) ;;
          *) echo "::error::Godot reports $installed_version; expected $expected_version"; exit 1 ;;
        esac
        mkdir -p "$HOME/godot"
        install -m 755 "$install_tmp/$name" "$HOME/godot/godot"

    - shell: bash
      run: echo "$HOME/godot" >> "$GITHUB_PATH"

    # Tag mirrors, release zips, toolchains and workspaces; tags are trusted as immutable.
    - uses: actions/cache@v6
      with:
        path: ~/.cache/gdpackage
        key: gdpackage-${{ github.repository }}-${{ steps.pkg.outputs.godot }}-${{ hashFiles(format('{0}/*.cfg', steps.pkg.outputs.rel), format('{0}/_export_ignore/*', steps.pkg.outputs.rel), format('{0}/export_ignore/*.yml', steps.pkg.outputs.rel)) }}
        restore-keys: gdpackage-${{ github.repository }}-${{ steps.pkg.outputs.godot }}-

    - name: Assemble project
      shell: bash
      env:
        TOOLCHAIN_REPO: brohd11/godot-gdpackage
        TOOLCHAIN_VERSION: ${{ inputs.toolchain-version }}
        GODOT_VERSION: ${{ steps.pkg.outputs.godot }}
        PKG_PATH: ${{ steps.pkg.outputs.path }}
        MOVED: ${{ steps.pkg.outputs.moved }}
      run: |
        set -euo pipefail
        v="$TOOLCHAIN_VERSION"
        [ -n "$v" ] || v=$(gh release view -R "$TOOLCHAIN_REPO" --json tagName -q .tagName)
        v="${v#v}"
        # Releases before 0.11.0 were package_exporter: asset package-exporter-<v>.zip, installed at
        # addons/package_exporter. Accepting both lets the last of them build the first gdpackage.
        zip=""
        for asset in "gdpackage-$v.zip" "package-exporter-$v.zip"; do
          for tag in "v$v" "$v"; do
            if gh release download "$tag" -R "$TOOLCHAIN_REPO" -p "$asset" -D "$RUNNER_TEMP" 2>/dev/null; then
              zip="$RUNNER_TEMP/$asset"; break 2
            fi
          done
        done
        [ -n "$zip" ] || { echo "::error::no gdpackage-$v.zip or package-exporter-$v.zip on release $v of $TOOLCHAIN_REPO"; exit 1; }
        echo "toolchain $(basename "$zip")"

        # The toolchain zip carries its install layout.
        mkdir -p "$WS"
        unzip -q "$zip" -d "$WS"
        toolchain_dir=addons/gdpackage
        [ -d "$WS/$toolchain_dir" ] || toolchain_dir=addons/package_exporter
        echo "TOOLCHAIN_DIR=$toolchain_dir" >> "$GITHUB_ENV"
        # The release CLI resolves this same version again. Seed its cache from the API download
        # so that lookup does not depend on a second download through the browser asset URL.
        toolchain_name=$(basename "$toolchain_dir")
        toolchain_cache="${XDG_CACHE_HOME:-$HOME/.cache}/$toolchain_name/toolchains/$toolchain_name-$v"
        mkdir -p "$toolchain_cache"
        cp "$zip" "$toolchain_cache/$(basename "$zip")"
        unzip -qo "$zip" -d "$toolchain_cache"
        if [ "$MOVED" = "true" ]; then
          # Joins at its install path, .git included - the export fetches it by tag from origin.
          mkdir -p "$WS/$(dirname "$PKG_PATH")"
          mv pkg "$WS/$PKG_PATH"
        fi
        # The same header ReleaseRunner.project_godot writes for its workspaces.
        features=$(echo "${GODOT_VERSION%%-*}" | cut -d. -f1,2)
        printf 'config_version=5\n\n[application]\n\nconfig/name="PE CI"\nconfig/features=PackedStringArray("%s")\n' "$features" > "$WS/project.godot"
        # Builds the class cache the toolchain needs. The package's deps aren't installed here, so
        # its scripts may log errors; only the toolchain's have to load.
        godot --headless --path "$WS" --import || true
